name: Gymini Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api-tests:
    name: API Tests (Newman)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install backend dependencies
        run: npm install
        working-directory: backend
      - name: Start backend server
        run: npm start &
        working-directory: backend
      - name: Wait for server
        run: sleep 3
      - name: Run Newman tests
        run: npm test
        working-directory: backend
      - name: Upload API report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-report
          path: reports/api-report.html
          if-no-files-found: warn

  smoke-tests:
    name: Smoke Tests (Playwright, fast)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install frontend dependencies
        run: npm install
        working-directory: frontend
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Run smoke tests
        run: npm run test:smoke -- --project=chromium
        working-directory: frontend

  lighthouse:
    name: Lighthouse (perf/a11y/best-practices/seo budgets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install frontend dependencies
        run: npm install
        working-directory: frontend
      - name: Build frontend
        run: npm run build
        working-directory: frontend
      - name: Run Lighthouse CI
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: npm run lighthouse
        working-directory: frontend

  ui-tests:
    name: UI Tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install frontend dependencies
        run: npm install
        working-directory: frontend
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox
        working-directory: frontend
      - name: Run Playwright tests
        run: npm test
        working-directory: frontend
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: reports/playwright-report/
          if-no-files-found: warn
